<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>VRC Nexus HUD</title>
<style>
    html, body { margin: 0; width: 768px; height: 320px; overflow: hidden; background: transparent; color: #f1f5f9; font: 26px/1.25 "Segoe UI", system-ui, sans-serif; user-select: none; }
    body { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 10px 14px; box-sizing: border-box; }
    .row { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 14px; background: rgba(6, 10, 16, 0.78); border: 2px solid rgba(56, 213, 230, 0.55); border-radius: 12px; font-size: 24px; }
    .row span { white-space: nowrap; }
    .row b { color: #38d5e6; font-weight: 600; }
    .subs { display: flex; flex-direction: column; gap: 6px; }
    .sub { padding: 6px 14px; background: rgba(6, 10, 16, 0.82); border-left: 5px solid #38d5e6; border-radius: 8px; font-size: 27px; }
    .sub.me { border-left-color: #f5c242; }
    .sub.unsure { opacity: 0.65; }
    .sub small { font-size: 18px; color: #94a3b8; }
    .sub .orig { display: block; font-size: 19px; color: #94a3b8; }
    .sub.old { opacity: 0.55; }
    [hidden] { display: none !important; }
</style>
</head>
<body data-i18n-nocorner>
<div class="subs" id="subs"></div>
<div class="row" id="info" hidden></div>
<script src="js/i18n-dict.js"></script>
<script src="js/nexus-i18n.js"></script>
<script src="js/nexus-hud.js"></script>
</body>
</html>
